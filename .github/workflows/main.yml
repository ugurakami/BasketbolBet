name: Basketball Analysis

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create sample data file
      run: |
        # Örnek veri dosyası oluştur (eğer yoksa)
        if [ ! -f "BasketbolFikstür - Sayfa1.tsv" ]; then
          echo "Tarih	Lig	Ev Sahibi	MS(Ev)	MS(Dep)	Deplasman	İY(Ev)	İY(Dep)" > "BasketbolFikstür - Sayfa1.tsv"
          echo "2024-01-15	Eurolig	Fenerbahçe Beko	85	78	Real Madrid	45	40" >> "BasketbolFikstür - Sayfa1.tsv"
          echo "2024-01-16	NBA	Lakers	110	105	Celtics	55	50" >> "BasketbolFikstür - Sayfa1.tsv"
          echo "Örnek veri dosyası oluşturuldu"
        fi
        
    - name: Run analysis
      run: |
        python main.py
