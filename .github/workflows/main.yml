name: 🏀 Basketbol Kelly Tahmin Botu Otomasyonu

on:
  schedule:
    # Her gün UTC saat 08:00'de çalışır (TRT ile yaklaşık 11:00)
    - cron: '0 8 * * *' 
  workflow_dispatch: # Arayüzden manuel çalıştırmaya izin verir

jobs:
  tahmin_yap_ve_gonder:
    runs-on: ubuntu-latest
    defaults:
      run:
        python $GITHUB_WORKSPACE/basketbol_tahmin_botu.py
    
    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Python 3.10 Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Gerekli Kütüphaneleri Kur
        run: |
          # Pandas, scikit-learn ve requests kütüphanelerini kurar
          pip install pandas scikit-learn requests

      # Önemli Not: Bu adımda veri dosyanızın (.tsv) de repoda olması gerekir.
      
      - name: Tahmin Kodunu Çalıştır ve Telegram'a Gönder
        env:
          # GitHub Secrets'tan alınacak gizli değişkenler
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        
        run: run: python $GITHUB_WORKSPACE/basketbol_tahmin_botu.py
